id: ingest-handbook
namespace: employee.handbook
description: >
  Fetches .md files from the madetech/handbook GitHub repo,
  embeds them using all-MiniLM-L6-v2, and stores them in PostgreSQL with pgvector.

tasks:
  - id: ingest
    type: io.kestra.plugin.scripts.python.Commands
    beforeCommands:
      - pip install uv > /dev/null 2>&1
      - uv sync --frozen
      - python download.py
    commands:
      - uv run python ingest_pipeline.py
    env:
      GITHUB_OWNER: "{{ envs.github_owner }}"
      GITHUB_REPO: "{{ envs.github_repo }}"
      GITHUB_BRANCH: "{{ envs.github_branch }}"
      PGHOST: "{{ envs.pghost }}"
      PGPORT: "{{ envs.pgport }}"
      PGDATABASE: "{{ envs.pgdatabase }}"
      PGUSER: "{{ envs.pguser }}"
      PGPASSWORD: "{{ envs.pgpassword }}"
      TABLE_NAME: "{{ envs.table_name }}"
      VECTOR_DIM: "{{ envs.vector_dim }}"
      MODEL_PATH: "{{ envs.model_path }}"
    workingDir: /app/project
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: python:3.13-slim
      volumes:
        - ./:/app/project:rw
