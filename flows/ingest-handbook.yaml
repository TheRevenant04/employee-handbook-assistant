id: ingest-handbook
namespace: employee.handbook
description: >
  Fetches .md files from the madetech/handbook GitHub repo,
  embeds them using all-MiniLM-L6-v2, and stores them in PostgreSQL with pgvector.

tasks:
  - id: ingest
    type: io.kestra.plugin.scripts.python.Commands
    commands:
      - |
        set -e
        cd /app/project

        echo "[START] pip install uv"
        time pip3 install uv > /dev/null 2>&1
        echo "[END] pip install uv"

        echo "[START] uv add onnxruntime tokenizers numpy"
        time uv add onnxruntime tokenizers numpy
        echo "[END] uv add onnxruntime tokenizers numpy"

        echo "[START] uv add --dev huggingface-hub"
        time uv add --dev huggingface-hub
        echo "[END] uv add --dev huggingface-hub"

        echo "[START] download_models.py"
        time uv run python scripts/download_models.py
        echo "[END] download_models.py"

        echo "[START] pipeline.py"
        time uv run python src/ingestion/pipeline.py
        echo "[END] pipeline.py"
    env:
      GITHUB_OWNER: "{{ envs.github_owner }}"
      GITHUB_REPO: "{{ envs.github_repo }}"
      GITHUB_BRANCH: "{{ envs.github_branch }}"
      PGHOST: "{{ envs.pghost }}"
      PGPORT: "{{ envs.pgport }}"
      PGDATABASE: "{{ envs.pgdatabase }}"
      PGUSER: "{{ envs.pguser }}"
      PGPASSWORD: "{{ envs.pgpassword }}"
      TABLE_NAME: "{{ envs.table_name }}"
      VECTOR_DIM: "{{ envs.vector_dim }}"
      MODEL_PATH: "{{ envs.model_path }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: python:3.12-slim
      volumes:
        - ./:/app/project:rw