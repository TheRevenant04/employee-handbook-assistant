[project]
name = "employee-handbook-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub==1.24.0",
    "numpy==2.4.6",
    "onnxruntime==1.27.0",
    "openai==2.46.0",
    "pandas==3.0.3",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "streamlit==1.59.2",
    "tokenizers==0.23.1",
    "tqdm==4.69.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
env = [
    "LLM_BASE_URL=http://localhost:11434/v1",
    "LLM_API_KEY=test-key",
    "LLM_MODEL=test-model",
    "PGDATABASE=test_db",
    "PGUSER=test_user",
    "PGPASSWORD=test_password",
    "PGHOST=localhost",
    "PGPORT=5432",
    "TABLE_NAME=handbook_documents",
    "VECTOR_DIM=384",
    "MODEL_PATH=models/Xenova/all-MiniLM-L6-v2",
]

[dependency-groups]
dev = [
    "jupyter==1.1.1",
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "pytest-dotenv==0.5.2",
    "pytest-cov==7.1.0",
    "huggingface-hub>=1.24.0",
]
