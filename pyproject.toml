[project]
name = "employee-handbook-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=0.9.9",
    "jupyter>=1.1.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.27.0",
    "openai>=2.46.0",
    "pandas>=2.3.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "psycopg_pool>=3.2.0",
    "pydantic>=2.10.0",
    "requests>=2.34.2",
    "streamlit>=1.59.2",
    "tokenizers>=0.23.1",
    "tqdm>=4.67.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
env = [
    "LLM_BASE_URL=http://localhost:11434/v1",
    "LLM_API_KEY=test-key",
    "LLM_MODEL=test-model",
    "PGDATABASE=test_db",
    "PGUSER=test_user",
    "PGPASSWORD=test_password",
    "PGHOST=localhost",
    "PGPORT=5432",
    "TABLE_NAME=employee_handbook",
    "VECTOR_DIM=384",
    "MODEL_PATH=models/Xenova/all-MiniLM-L6-v2",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.24.0",
    "jupyter>=1.1.1",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-dotenv>=0.5.0",
]
